<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Status pesanan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FCF9F5; color: #2B1810; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">

<div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px;">
  <div style="height: 44px; display: flex; align-items: center;">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.4px;">Pesanan Saya</span>
  </div>

  <div style="display: flex; border-bottom: 1px solid #EDE3D8;">
    <a href="Status.dc.html" style="flex: 1; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 700; color: #6B3216; border-bottom: 2px solid #6B3216; margin-bottom: -1px;">Aktif</a>
    <a href="Riwayat.dc.html" style="flex: 1; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; font-weight: 600; color: #7A6355; border-bottom: 2px solid transparent; margin-bottom: -1px;">Riwayat</a>
  </div>

  <div style="border-radius: 24px; background: #6B3216; color: #FBEFE0; padding: 20px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: space-between;">
    <div style="position: absolute; right: -30px; top: -40px; width: 160px; height: 160px; border-radius: 80px; background: #C47A3A; opacity: 0.45;"></div>
    <div style="position: relative; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 12px; font-weight: 600; opacity: 0.85;">Nomor antrean</span>
      <span style="font-size: 48px; font-weight: 800; letter-spacing: -1px; line-height: 1;">A-014</span>
      <span style="font-size: 13px; font-weight: 500; opacity: 0.9;">Makan di tempat · Meja 7</span>
    </div>
    <span style="position: relative; height: 32px; padding: 0 14px; border-radius: 16px; background: #FBEFE0; color: #6B3216; font-size: 13px; font-weight: 800; display: flex; align-items: center;">Diproses</span>
  </div>

  <div style="background: #fff; border-radius: 20px; padding: 16px; box-shadow: 0 2px 10px rgba(60,30,10,0.05); display: flex; flex-direction: column;">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; gap: 14px; align-items: stretch;">
        <div style="display: flex; flex-direction: column; align-items: center; width: 28px;">
          <span style="width: 28px; height: 28px; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: {{s.dot}}; border: 2px solid {{s.dotLine}}; color: #fff;">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
            </sc-if>
          </span>
          <span style="width: 2px; flex-grow: 1; min-height: 20px; background: {{s.line}};"></span>
        </div>
        <div style="padding-bottom: 14px; display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-size: 14px; font-weight: {{s.weight}}; color: {{s.color}};">{{s.label}}</span>
          <span style="font-size: 12px; color: #7A6355;">{{s.note}}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="background: #fff; border-radius: 20px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(60,30,10,0.05); display: flex; flex-direction: column; gap: 8px; font-size: 13px;">
    <div style="display: flex; justify-content: space-between;"><span style="font-weight: 600;">1× Kopi Susu Kita (Large, Es)</span><span style="color: #7A6355;">Rp31.000</span></div>
    <div style="display: flex; justify-content: space-between;"><span style="font-weight: 600;">2× Caramel Latte (Regular, Panas)</span><span style="color: #7A6355;">Rp56.000</span></div>
    <div style="height: 1px; background: #EDE3D8;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-weight: 700;">Total dibayar</span><span style="font-weight: 800; font-size: 16px; color: #6B3216;">Rp76.560</span></div>
  </div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; box-shadow: 0 -6px 24px rgba(60,30,10,0.08); display: flex; flex-direction: column;">
  <a href="Keranjang.dc.html" style="height: 56px; padding: 0 20px; border-radius: 28px 28px 0 0; background: #F6ECE0; box-sizing: border-box; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2B1810;">
    <span style="width: 36px; height: 36px; border-radius: 12px; background: #fff; color: #6B3216; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19.5 8H6"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg></span>
    <span style="flex-grow: 1; font-size: 13px; color: #7A6355; font-weight: 600;">3 item · <span style="color: #2B1810; font-weight: 800;">Rp76.560</span></span>
    <span style="font-size: 13px; font-weight: 700; color: #6B3216; display: flex; align-items: center; gap: 2px;">Lihat keranjang<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span>
  </a>
  <div style="height: 84px; box-sizing: border-box; padding: 10px 8px 14px; display: flex;">
    <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A6355; font-size: 12px; font-weight: 600;"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1v-9z"/></svg></span>Beranda</a>
    <a href="Menu.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A6355; font-size: 12px; font-weight: 600;"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8z"/><path d="M16 9h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3v2M11 3v2M14 3v2"/></svg></span>Menu</a>
    <a href="Status.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B3216; font-size: 12px; font-weight: 700;"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: #F1E4D4;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg></span>Pesanan</a>
    <a href="Akun.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7A6355; font-size: 12px; font-weight: 600;"><span style="width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4.5-6 8-6s7 2 8 6"/></svg></span>Akun</a>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = [
      ['Menunggu bayar', 'Bayar di kasir dengan tunai atau QRIS'],
      ['Dibayar', 'Pembayaran dikonfirmasi kasir'],
      ['Diproses', 'Barista sedang membuat pesananmu'],
      ['Siap diambil', 'Kami panggil nomor antreanmu'],
      ['Selesai', 'Terima kasih sudah mampir']
    ];
    const current = 2;
    return {
      steps: labels.map((l, i) => {
        const done = i < current;
        const now = i === current;
        return {
          label: l[0],
          note: now || i === current + 1 ? l[1] : (done ? 'Selesai' : l[1]),
          done,
          dot: done ? '#6B3216' : (now ? '#C47A3A' : '#fff'),
          dotLine: done ? '#6B3216' : (now ? '#C47A3A' : '#D9CABB'),
          line: i < current ? '#6B3216' : '#E6D9CB',
          weight: now ? 800 : 600,
          color: i > current ? '#7A6355' : '#2B1810'
        };
      })
    };
  }
}
</script>
</body>
</html>
